server.port=8088

# 数据库配置（默认从环境变量读取，本地开发见 application-dev.properties）
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=30000
spring.datasource.druid.validation-query=select 1
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false
spring.datasource.druid.pool-prepared-statements=false
spring.datasource.druid.max-pool-prepared-statement-per-connection-size=-1
spring.datasource.druid.use-global-data-source-stat=true

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT 配置
jwt.secret=${JWT_SECRET:}
jwt.expiration=604800

# 开发模式 bypass token（生产环境请留空或删除）
dev.bypass-token=${DEV_BYPASS_TOKEN:}

# License 授权配置
# 是否开启业务接口的 License 强制校验；客户端激活后需在 X-License 头携带授权码
license.enforce=${LICENSE_ENFORCE:true}
# 密钥对路径（不存在时自动生成）。服务端即厂商签发端，私钥仅部署在服务端
license.public-key-path=${LICENSE_PUBLIC_KEY_PATH:./license/keys/public.key}
license.private-key-path=${LICENSE_PRIVATE_KEY_PATH:./license/keys/private.key}

# =============================================================
# 客户端模型接口（/api/v1/client）
# 供应商密钥只存在服务端，通过环境变量注入，不下发客户端
# =============================================================
client.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
client.deepseek.api-key=${DEEPSEEK_API_KEY:}
client.deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}
client.deepseek.connect-timeout-ms=10000
client.deepseek.read-timeout-ms=120000

client.bailian.origin=${BAILIAN_ORIGIN:https://dashscope.aliyuncs.com}
client.bailian.api-key=${BAILIAN_API_KEY:}
client.bailian.connect-timeout-ms=10000

client.chat.space-id=${CLIENT_CHAT_SPACE_ID:chat-policy-v1}
client.chat.context-budget=8192
client.chat.reserved-output-tokens=1536
client.chat.min-output-tokens=256
client.chat.max-output-tokens=1536
client.chat.max-request-bytes=2097152
client.chat.max-messages=1024
client.chat.max-response-chars=2000000
client.chat.stream-timeout-ms=180000

client.asr.model=${BAILIAN_ASR_MODEL:qwen3-asr-flash}
client.asr.max-bytes=1920044
client.asr.read-timeout-ms=90000
client.asr.max-chars=16000

client.tts.model=${BAILIAN_TTS_MODEL:qwen3-tts-flash}
client.tts.voice=${BAILIAN_TTS_VOICE:Cherry}
client.tts.voices=${BAILIAN_TTS_VOICES:Cherry,Serena,Ethan}
client.tts.language-type=${BAILIAN_TTS_LANGUAGE:Auto}
client.tts.segmentation-version=speech-segments-v1
client.tts.config-version=${CLIENT_TTS_CONFIG_VERSION:voice-policy-v1}
client.tts.max-text-chars=32000
client.tts.read-timeout-ms=90000
client.tts.max-audio-bytes=16777216

client.image.model=${BAILIAN_IMAGE_MODEL:wan2.7-image}
client.image.config-version=${CLIENT_IMAGE_CONFIG_VERSION:image-policy-v1}
client.image.max-prompt-chars=3000
client.image.max-reference-bytes=20971520
client.image.max-request-bytes=33554432
client.image.max-result-bytes=20971520
client.image.read-timeout-ms=180000
client.image.download-timeout-ms=60000
client.image.max-side=8192
client.image.max-pixels=33554432

client.embedding.model=${BAILIAN_EMBEDDING_MODEL:text-embedding-v4}
client.embedding.dimensions=1024
client.embedding.space-id=${CLIENT_EMBEDDING_SPACE_ID:embedding-space-v1}
client.embedding.max-batch-size=10
client.embedding.max-text-chars=4000
client.embedding.max-response-bytes=2097152
client.embedding.read-timeout-ms=60000

client.media.dir=${CLIENT_MEDIA_DIR:./data/media}
client.media.ttl-hours=24
client.requests.retention-hours=24

